services:
  aniu:
    build:
      context: .
    image: ghcr.io/anacondakc/aniu:${ANIU_IMAGE_TAG:-latest}
    container_name: aniu
    restart: unless-stopped
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
